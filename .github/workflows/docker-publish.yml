name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    # rebuild the CI image when the Dockerfile changes
    paths:
      - '.github/workflows/Dockerfile'

# drop all default permissions; grant least privilege per job
permissions: {}

jobs:
  Build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4
        with:
          platforms: amd64
          cache-image: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4
      - name: Extract version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          tags: |
            tylerkelly/rust-aptupdatechecker-ci:latest
            tylerkelly/rust-aptupdatechecker-ci:aptupdatechecker-v${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=tylerkelly/rust-aptupdatechecker-ci:latest
          cache-to: type=inline
