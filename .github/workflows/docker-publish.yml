name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    # rebuild the CI image when the Dockerfile changes
    paths:
      - '.github/workflows/Dockerfile'

# drop all default permissions; grant least privilege per job
permissions: {}

jobs:
  Build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        with:
          platforms: amd64
          cache-image: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Extract version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          tags: |
            tylerkelly/rust-aptupdatechecker-ci:latest
            tylerkelly/rust-aptupdatechecker-ci:aptupdatechecker-v${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=tylerkelly/rust-aptupdatechecker-ci:latest
          cache-to: type=inline
