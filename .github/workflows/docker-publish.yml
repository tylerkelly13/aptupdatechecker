name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    # rebuild the CI image when the Dockerfile changes
    paths:
      - '.github/workflows/Dockerfile'

# drop all default permissions; grant least privilege per job
permissions: {}

jobs:
  Build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4
        with:
          platforms: amd64
          cache-image: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
      - name: Extract version from Cargo.toml
        id: version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          tags: |
            tylerkelly/rust-aptupdatechecker-ci:latest
            tylerkelly/rust-aptupdatechecker-ci:aptupdatechecker-v${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=tylerkelly/rust-aptupdatechecker-ci:latest
          cache-to: type=inline
